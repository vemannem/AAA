<title>Gen AI Fundamentals</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="AAA Academy: a self-paced course on how large language models work inside, from tokens and attention to agents and multi-agent systems.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: sticky top bar + left week rail (desktop) / week picker (phone); content column ~70ch.
   Palette: cool paper and ink, cobalt for action, amber for checkpoints, green/red for quiz state. */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#eef1f5; --ink:#141a24; --muted:#586273; --line:#dce1e8;
  --accent:#1f56c9; --accent-ink:#ffffff; --accent-soft:#e3ebfb; --signal:#b8661a; --signal-soft:#fbeedd;
  --ok:#1b7f52; --ok-soft:#ddf2e7; --bad:#b83a34; --bad-soft:#f8e1df;
  --code-bg:#0f1622; --code-ink:#dbe3ee; --code-kw:#8fb4ff; --code-str:#9fd6a8; --code-com:#7d8a9c; --code-num:#f2b77a; --code-fn:#e6c27a;
  --d-core:#e3ebfb; --d-core-s:#1f56c9; --d-store:#e9f4ee; --d-store-s:#1b7f52; --d-guard:#fbeedd; --d-guard-s:#b8661a;
  --d-ext:#f0f1f4; --d-ext-s:#7a8495; --d-user:#f3e8fb; --d-user-s:#7a3fb0;
  --f-display:"Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e131b; --surface:#151c27; --surface-2:#1b2432; --ink:#e5e9f0; --muted:#9aa4b4; --line:#273244;
  --accent:#6f9bff; --accent-ink:#0b1220; --accent-soft:#1c2a47; --signal:#f0a650; --signal-soft:#3a2a17;
  --ok:#4fc58a; --ok-soft:#163327; --bad:#f07a72; --bad-soft:#3b1d1c;
  --code-bg:#0a0f17; --code-ink:#dbe3ee;
  --d-core:#1c2a47; --d-core-s:#6f9bff; --d-store:#163327; --d-store-s:#4fc58a; --d-guard:#3a2a17; --d-guard-s:#f0a650;
  --d-ext:#1f2733; --d-ext-s:#8a95a7; --d-user:#2c1e3d; --d-user-s:#c08cf0; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e131b; --surface:#151c27; --surface-2:#1b2432; --ink:#e5e9f0; --muted:#9aa4b4; --line:#273244;
  --accent:#6f9bff; --accent-ink:#0b1220; --accent-soft:#1c2a47; --signal:#f0a650; --signal-soft:#3a2a17;
  --ok:#4fc58a; --ok-soft:#163327; --bad:#f07a72; --bad-soft:#3b1d1c;
  --code-bg:#0a0f17; --code-ink:#dbe3ee;
  --d-core:#1c2a47; --d-core-s:#6f9bff; --d-store:#163327; --d-store-s:#4fc58a; --d-guard:#3a2a17; --d-guard-s:#f0a650;
  --d-ext:#1f2733; --d-ext-s:#8a95a7; --d-user:#2c1e3d; --d-user-s:#c08cf0; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.65 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--accent)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,4.4vw,44px);letter-spacing:-.02em}
h2{font-size:clamp(22px,2.8vw,28px);letter-spacing:-.01em}
h3{font-size:19px}
h4{font-size:15px}
p{margin:0}
code{font-family:var(--f-mono);font-size:.88em;background:var(--surface-2);padding:.1em .35em;border-radius:5px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font:600 11.5px/1 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font:700 13px var(--f-display);flex:none}
.brand-name{font:700 17px var(--f-display);white-space:nowrap}
.brand-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-prog{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;width:120px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.theme-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:5px 9px;font-size:13px}

/* Shell */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:32px;max-width:1320px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);align-self:start;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 90px);overflow:auto}
.rail a{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center;text-decoration:none;color:var(--ink);padding:8px 10px;border-radius:8px;font-size:14px}
.rail a:hover{background:var(--surface-2)}
.rail a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rail .wk{font:600 12px var(--f-mono);color:var(--muted);text-align:center}
.rail a.on .wk{color:var(--accent)}
.rail .mini{grid-column:2;height:3px;background:var(--surface-2);border-radius:9px;overflow:hidden;margin-top:4px}
.rail .mini i{display:block;height:100%;background:var(--ok)}
.rail hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.picker{display:none}
main{min-width:0}
.page{display:flex;flex-direction:column;gap:28px;max-width:860px}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);gap:16px}
  .rail{display:none}
  .picker{display:block}
  .picker select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 15px var(--f-body)}
  .top-prog .bar{width:70px}
  .brand-sub{display:none}
}

/* Home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px}
.hero p.lead{font-size:17px;color:var(--muted);max-width:60ch;margin-top:12px}
.hero .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:9px;padding:10px 16px;font-weight:600;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ring{width:132px;height:132px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:700 26px var(--f-display);font-variant-numeric:tabular-nums}
.ring .v small{display:block;font:500 11px var(--f-body);color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:16px;font-size:13px;color:var(--muted)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
@media (max-width:620px){.hero{grid-template-columns:1fr;padding:20px}.ring{width:104px;height:104px}}

.road{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.wcard{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.wcard:hover{border-color:var(--accent)}
.wcard .n{font:600 12px var(--f-mono);color:var(--accent)}
.wcard h3{font-size:17px}
.wcard p{font-size:13.5px;color:var(--muted)}
.wcard .foot{margin-top:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.wcard .foot .bar{flex:1;width:auto}
.tag{display:inline-block;font:600 10.5px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:5px;background:var(--signal-soft);color:var(--signal)}

.section{display:flex;flex-direction:column;gap:14px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;counter-reset:s}
.steps div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:14px}
.steps div b{display:block;font-family:var(--f-display);margin-bottom:4px}

/* Week page */
.whead{display:flex;flex-direction:column;gap:12px}
.whead .meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted)}
.outcomes{margin:0;padding-left:20px;display:grid;gap:4px}
.srcbox{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--muted)}
.srcbox b{color:var(--ink)}

details.lesson{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.lesson>summary{list-style:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 18px;cursor:pointer}
details.lesson>summary::-webkit-details-marker{display:none}
.lid{font:600 13px var(--f-mono);color:var(--accent);background:var(--accent-soft);border-radius:7px;padding:4px 8px}
.lsum h3{font-size:17px}
.lsum .muted{font-size:12.5px}
.done-pill{font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.done-pill.yes{background:var(--ok-soft);color:var(--ok)}
.lbody{padding:0 18px 20px;display:flex;flex-direction:column;gap:18px;border-top:1px solid var(--line);padding-top:18px}
.prose{display:flex;flex-direction:column;gap:12px;max-width:68ch}
.prose ul,.prose ol{margin:0;padding-left:20px;display:grid;gap:5px}
.prose h4{margin-top:6px}
.prose table{border-collapse:collapse;font-size:13.5px;width:100%}
.prose th,.prose td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.prose th{font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.tablewrap{overflow-x:auto}
.callout{border-radius:10px;padding:14px 16px;background:var(--accent-soft);display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.callout.ex{background:var(--surface-2)}
.callout.cp{background:var(--signal-soft)}
.callout .eyebrow{color:inherit;opacity:.8}

figure.dg{margin:0;background:var(--surface-2);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.dgwrap{overflow-x:auto}
.dgwrap svg{display:block;width:100%;min-width:560px;height:auto}
figure.dg figcaption{font-size:12.5px;color:var(--muted)}
svg .n-core{fill:var(--d-core);stroke:var(--d-core-s)} svg .n-store{fill:var(--d-store);stroke:var(--d-store-s)}
svg .n-guard{fill:var(--d-guard);stroke:var(--d-guard-s)} svg .n-ext{fill:var(--d-ext);stroke:var(--d-ext-s)} svg .n-user{fill:var(--d-user);stroke:var(--d-user-s)}
svg .nl{fill:var(--ink);font:600 13px var(--f-body)} svg .ns{fill:var(--muted);font:400 11px var(--f-body)}
svg .e{fill:none;stroke:var(--muted);stroke-width:1.4} svg .e.dash{stroke-dasharray:5 4} svg .e.hot{stroke:var(--accent);stroke-width:1.8}
svg .el{fill:var(--muted);font:500 10.5px var(--f-body)} svg .elb{fill:var(--surface-2)}
svg .ah{fill:var(--muted)} svg .ah.hot{fill:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;border:1.5px solid}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:none;color:var(--muted);padding:8px 12px;font-weight:600;font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabpanel{display:flex;flex-direction:column;gap:12px;padding-top:12px}
.codehead{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--code-bg);color:var(--code-com);border-radius:10px 10px 0 0;padding:8px 12px;font:500 12px var(--f-mono)}
.codehead .fn{color:var(--code-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.copy{border:1px solid #2b3647;background:#18212f;color:#cfd8e5;border-radius:6px;padding:3px 9px;font:600 11.5px var(--f-body);flex:none}
pre.code{margin:0;background:var(--code-bg);color:var(--code-ink);border-radius:0 0 10px 10px;padding:14px 16px;overflow-x:auto;font:12.8px/1.6 var(--f-mono);tab-size:4;max-height:560px}
pre.code code{background:none;padding:0;font-size:inherit;color:inherit}
.runline{font:12.5px var(--f-mono);color:var(--muted)}
.runline b{color:var(--ink);font-weight:600}
.hljs-keyword,.hljs-built_in,.hljs-literal{color:var(--code-kw)} .hljs-string{color:var(--code-str)} .hljs-comment,.hljs-meta{color:var(--code-com);font-style:italic}
.hljs-number{color:var(--code-num)} .hljs-title,.hljs-title.function_{color:var(--code-fn)} .hljs-params{color:var(--code-ink)}

.takeaways{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.takeaways li{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:14px}
.takeaways li::before{content:"✓";color:var(--ok);font-weight:700}

.tutor{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tutor-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--surface-2)}
.tutor-h b{font-family:var(--f-display);font-size:14.5px}
.tutor pre{margin:0;padding:12px 14px;white-space:pre-wrap;font:12.8px/1.55 var(--f-mono);color:var(--ink);background:var(--surface);max-height:260px;overflow:auto}
.copy2{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:4px 10px;font:600 12px var(--f-body);flex:none}
.complete{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;background:var(--ok-soft);font-weight:600;color:var(--ok);cursor:pointer;font-size:14.5px}
.complete input{width:18px;height:18px;accent-color:var(--ok)}

/* Quiz */
.quiz{display:flex;flex-direction:column;gap:14px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.q .qt{font-weight:600}
.q .opts{display:grid;gap:6px}
.q label{display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:start;padding:9px 11px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:14.5px}
.q label:hover{border-color:var(--accent)}
.q input{margin-top:4px;accent-color:var(--accent)}
.q label.right{border-color:var(--ok);background:var(--ok-soft)}
.q label.wrong{border-color:var(--bad);background:var(--bad-soft)}
.q .why{font-size:13.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.qbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.score{font:700 15px var(--f-display);font-variant-numeric:tabular-nums}
.levels{display:grid;gap:10px}
.cap-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.cap-grid>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.rubric td:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.srctable td:first-child{white-space:nowrap;font-weight:600}
.foot-credit{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
.hub-link{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:8px}
.hub-link:hover{background:var(--surface-2);color:var(--ink)}
.runbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.runbox>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.runbox ol{margin:0;padding-left:20px;display:grid;gap:4px}
.lq{background:var(--surface-2);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.lq .q{background:var(--surface)}
.math{font-family:var(--f-mono);font-size:13.5px;background:var(--surface-2);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre}
.comm-link{font-weight:600;text-decoration:none;white-space:nowrap;color:var(--accent)}
.comm-link .cl-narrow{display:none}
@media (max-width:600px){.comm-link .cl-wide{display:none}.comm-link .cl-narrow{display:inline}#topbar-pct{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
