<style>
/* Layout: sticky top bar + left week rail (desktop) / week picker (phone); content column ~70ch.
   Palette: cool paper and ink, cobalt for action, amber for checkpoints, green/red for quiz state. */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#eef1f5; --ink:#141a24; --muted:#586273; --line:#dce1e8;
  --accent:#1f56c9; --accent-ink:#ffffff; --accent-soft:#e3ebfb; --signal:#b8661a; --signal-soft:#fbeedd;
  --ok:#1b7f52; --ok-soft:#ddf2e7; --bad:#b83a34; --bad-soft:#f8e1df;
  --code-bg:#0f1622; --code-ink:#dbe3ee; --code-kw:#8fb4ff; --code-str:#9fd6a8; --code-com:#7d8a9c; --code-num:#f2b77a; --code-fn:#e6c27a;
  --d-core:#e3ebfb; --d-core-s:#1f56c9; --d-store:#e9f4ee; --d-store-s:#1b7f52; --d-guard:#fbeedd; --d-guard-s:#b8661a;
  --d-ext:#f0f1f4; --d-ext-s:#7a8495; --d-user:#f3e8fb; --d-user-s:#7a3fb0;
  --f-display:"Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e131b; --surface:#151c27; --surface-2:#1b2432; --ink:#e5e9f0; --muted:#9aa4b4; --line:#273244;
  --accent:#6f9bff; --accent-ink:#0b1220; --accent-soft:#1c2a47; --signal:#f0a650; --signal-soft:#3a2a17;
  --ok:#4fc58a; --ok-soft:#163327; --bad:#f07a72; --bad-soft:#3b1d1c;
  --code-bg:#0a0f17; --code-ink:#dbe3ee;
  --d-core:#1c2a47; --d-core-s:#6f9bff; --d-store:#163327; --d-store-s:#4fc58a; --d-guard:#3a2a17; --d-guard-s:#f0a650;
  --d-ext:#1f2733; --d-ext-s:#8a95a7; --d-user:#2c1e3d; --d-user-s:#c08cf0; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e131b; --surface:#151c27; --surface-2:#1b2432; --ink:#e5e9f0; --muted:#9aa4b4; --line:#273244;
  --accent:#6f9bff; --accent-ink:#0b1220; --accent-soft:#1c2a47; --signal:#f0a650; --signal-soft:#3a2a17;
  --ok:#4fc58a; --ok-soft:#163327; --bad:#f07a72; --bad-soft:#3b1d1c;
  --code-bg:#0a0f17; --code-ink:#dbe3ee;
  --d-core:#1c2a47; --d-core-s:#6f9bff; --d-store:#163327; --d-store-s:#4fc58a; --d-guard:#3a2a17; --d-guard-s:#f0a650;
  --d-ext:#1f2733; --d-ext-s:#8a95a7; --d-user:#2c1e3d; --d-user-s:#c08cf0; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.65 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--accent)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,4.4vw,44px);letter-spacing:-.02em}
h2{font-size:clamp(22px,2.8vw,28px);letter-spacing:-.01em}
h3{font-size:19px}
h4{font-size:15px}
p{margin:0}
code{font-family:var(--f-mono);font-size:.88em;background:var(--surface-2);padding:.1em .35em;border-radius:5px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font:600 11.5px/1 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font:700 13px var(--f-display);flex:none}
.brand-name{font:700 17px var(--f-display);white-space:nowrap}
.brand-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-prog{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;width:120px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.theme-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:5px 9px;font-size:13px}

/* Shell */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:32px;max-width:1320px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);align-self:start;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 90px);overflow:auto}
.rail a{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center;text-decoration:none;color:var(--ink);padding:8px 10px;border-radius:8px;font-size:14px}
.rail a:hover{background:var(--surface-2)}
.rail a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rail .wk{font:600 12px var(--f-mono);color:var(--muted);text-align:center}
.rail a.on .wk{color:var(--accent)}
.rail .mini{grid-column:2;height:3px;background:var(--surface-2);border-radius:9px;overflow:hidden;margin-top:4px}
.rail .mini i{display:block;height:100%;background:var(--ok)}
.rail hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.picker{display:none}
main{min-width:0}
.page{display:flex;flex-direction:column;gap:28px;max-width:860px}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);gap:16px}
  .rail{display:none}
  .picker{display:block}
  .picker select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 15px var(--f-body)}
  .top-prog .bar{width:70px}
  .brand-sub{display:none}
}

/* Home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px}
.hero p.lead{font-size:17px;color:var(--muted);max-width:60ch;margin-top:12px}
.hero .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:9px;padding:10px 16px;font-weight:600;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ring{width:132px;height:132px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:700 26px var(--f-display);font-variant-numeric:tabular-nums}
.ring .v small{display:block;font:500 11px var(--f-body);color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:16px;font-size:13px;color:var(--muted)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
@media (max-width:620px){.hero{grid-template-columns:1fr;padding:20px}.ring{width:104px;height:104px}}

.road{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.wcard{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.wcard:hover{border-color:var(--accent)}
.wcard .n{font:600 12px var(--f-mono);color:var(--accent)}
.wcard h3{font-size:17px}
.wcard p{font-size:13.5px;color:var(--muted)}
.wcard .foot{margin-top:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.wcard .foot .bar{flex:1;width:auto}
.tag{display:inline-block;font:600 10.5px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:5px;background:var(--signal-soft);color:var(--signal)}

.section{display:flex;flex-direction:column;gap:14px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;counter-reset:s}
.steps div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:14px}
.steps div b{display:block;font-family:var(--f-display);margin-bottom:4px}

/* Week page */
.whead{display:flex;flex-direction:column;gap:12px}
.whead .meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted)}
.outcomes{margin:0;padding-left:20px;display:grid;gap:4px}
.srcbox{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--muted)}
.srcbox b{color:var(--ink)}

details.lesson{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.lesson>summary{list-style:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 18px;cursor:pointer}
details.lesson>summary::-webkit-details-marker{display:none}
.lid{font:600 13px var(--f-mono);color:var(--accent);background:var(--accent-soft);border-radius:7px;padding:4px 8px}
.lsum h3{font-size:17px}
.lsum .muted{font-size:12.5px}
.done-pill{font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.done-pill.yes{background:var(--ok-soft);color:var(--ok)}
.lbody{padding:0 18px 20px;display:flex;flex-direction:column;gap:18px;border-top:1px solid var(--line);padding-top:18px}
.prose{display:flex;flex-direction:column;gap:12px;max-width:68ch}
.prose ul,.prose ol{margin:0;padding-left:20px;display:grid;gap:5px}
.prose h4{margin-top:6px}
.prose table{border-collapse:collapse;font-size:13.5px;width:100%}
.prose th,.prose td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.prose th{font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.tablewrap{overflow-x:auto}
.callout{border-radius:10px;padding:14px 16px;background:var(--accent-soft);display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.callout.ex{background:var(--surface-2)}
.callout.cp{background:var(--signal-soft)}
.callout .eyebrow{color:inherit;opacity:.8}

figure.dg{margin:0;background:var(--surface-2);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.dgwrap{overflow-x:auto}
.dgwrap svg{display:block;width:100%;min-width:560px;height:auto}
figure.dg figcaption{font-size:12.5px;color:var(--muted)}
svg .n-core{fill:var(--d-core);stroke:var(--d-core-s)} svg .n-store{fill:var(--d-store);stroke:var(--d-store-s)}
svg .n-guard{fill:var(--d-guard);stroke:var(--d-guard-s)} svg .n-ext{fill:var(--d-ext);stroke:var(--d-ext-s)} svg .n-user{fill:var(--d-user);stroke:var(--d-user-s)}
svg .nl{fill:var(--ink);font:600 13px var(--f-body)} svg .ns{fill:var(--muted);font:400 11px var(--f-body)}
svg .e{fill:none;stroke:var(--muted);stroke-width:1.4} svg .e.dash{stroke-dasharray:5 4} svg .e.hot{stroke:var(--accent);stroke-width:1.8}
svg .el{fill:var(--muted);font:500 10.5px var(--f-body)} svg .elb{fill:var(--surface-2)}
svg .ah{fill:var(--muted)} svg .ah.hot{fill:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;border:1.5px solid}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:none;color:var(--muted);padding:8px 12px;font-weight:600;font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabpanel{display:flex;flex-direction:column;gap:12px;padding-top:12px}
.codehead{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--code-bg);color:var(--code-com);border-radius:10px 10px 0 0;padding:8px 12px;font:500 12px var(--f-mono)}
.codehead .fn{color:var(--code-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.copy{border:1px solid #2b3647;background:#18212f;color:#cfd8e5;border-radius:6px;padding:3px 9px;font:600 11.5px var(--f-body);flex:none}
pre.code{margin:0;background:var(--code-bg);color:var(--code-ink);border-radius:0 0 10px 10px;padding:14px 16px;overflow-x:auto;font:12.8px/1.6 var(--f-mono);tab-size:4;max-height:560px}
pre.code code{background:none;padding:0;font-size:inherit;color:inherit}
.runline{font:12.5px var(--f-mono);color:var(--muted)}
.runline b{color:var(--ink);font-weight:600}
.hljs-keyword,.hljs-built_in,.hljs-literal{color:var(--code-kw)} .hljs-string{color:var(--code-str)} .hljs-comment,.hljs-meta{color:var(--code-com);font-style:italic}
.hljs-number{color:var(--code-num)} .hljs-title,.hljs-title.function_{color:var(--code-fn)} .hljs-params{color:var(--code-ink)}

.takeaways{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.takeaways li{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:14px}
.takeaways li::before{content:"✓";color:var(--ok);font-weight:700}

.tutor{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tutor-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--surface-2)}
.tutor-h b{font-family:var(--f-display);font-size:14.5px}
.tutor pre{margin:0;padding:12px 14px;white-space:pre-wrap;font:12.8px/1.55 var(--f-mono);color:var(--ink);background:var(--surface);max-height:260px;overflow:auto}
.copy2{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:4px 10px;font:600 12px var(--f-body);flex:none}
.complete{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;background:var(--ok-soft);font-weight:600;color:var(--ok);cursor:pointer;font-size:14.5px}
.complete input{width:18px;height:18px;accent-color:var(--ok)}

/* Quiz */
.quiz{display:flex;flex-direction:column;gap:14px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.q .qt{font-weight:600}
.q .opts{display:grid;gap:6px}
.q label{display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:start;padding:9px 11px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:14.5px}
.q label:hover{border-color:var(--accent)}
.q input{margin-top:4px;accent-color:var(--accent)}
.q label.right{border-color:var(--ok);background:var(--ok-soft)}
.q label.wrong{border-color:var(--bad);background:var(--bad-soft)}
.q .why{font-size:13.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.qbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.score{font:700 15px var(--f-display);font-variant-numeric:tabular-nums}
.levels{display:grid;gap:10px}
.cap-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.cap-grid>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.rubric td:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.srctable td:first-child{white-space:nowrap;font-weight:600}
.foot-credit{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
.comm-link{display:inline-flex;align-items:center;gap:6px;font-weight:600;text-decoration:none;white-space:nowrap;color:var(--accent)}
.comm-link .cl-narrow{display:none}
.wa-ic{width:16px;height:16px;flex:none;display:inline-block;vertical-align:-3px;margin-right:5px}
.comm-link .wa-ic{margin-right:0}
@media (max-width:600px){.comm-link .cl-wide{display:none}.comm-link .cl-narrow{display:inline}#topbar-pct{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

"""Shared Claude helper for every ShipGrade AI lab.

Production defaults live here, not in each script:
- one model id, overridable with the CLAUDE_MODEL env var
- an explicit effort level (Claude Opus 5.5 defaults to "medium")
- server-side refusal fallbacks, so a declined request is retried on another model
- a request id and latency on every call, for logs and traces
- an offline stub when ANTHROPIC_API_KEY is not set, so labs still run
"""
import os
import time
import uuid
from dataclasses import dataclass, field

MODEL = os.getenv("CLAUDE_MODEL", "claude-opus-5-5")
FAST_MODEL = os.getenv("CLAUDE_FAST_MODEL", "claude-haiku-5-5")
OFFLINE = not os.getenv("ANTHROPIC_API_KEY")

_client = None


def client():
    global _client
    if _client is None and not OFFLINE:
        import anthropic
        _client = anthropic.Anthropic(max_retries=2, timeout=60.0)
    return _client


@dataclass
class Reply:
    text: str
    request_id: str
    latency_ms: float
    input_tokens: int = 0
    output_tokens: int = 0
    cache_read_tokens: int = 0
    model: str = MODEL
    raw: object = field(default=None, repr=False)


def ask(prompt, system=None, model=None, max_tokens=4000, effort="medium", **extra):
    """Send one user message and return a Reply. extra is passed to the API (tools, documents...)."""
    rid = "req_" + uuid.uuid4().hex[:12]
    start = time.perf_counter()
    model = model or MODEL
    if OFFLINE:
        text = "[offline stub] I would answer: " + str(prompt)[:160]
        return Reply(text, rid, (time.perf_counter() - start) * 1000, model=model)

    content = prompt if isinstance(prompt, list) else [{"type": "text", "text": prompt}]
    params = dict(
        model=model,
        max_tokens=max_tokens,
        messages=[{"role": "user", "content": content}],
        output_config={"effort": effort},
        extra_headers={"x-request-id": rid},
    )
    if system:
        params["system"] = system
    params.update(extra)
    if model != FAST_MODEL:
        # Refusal fallbacks are not available on Haiku, so only add them for the main model.
        params["betas"] = ["server-side-fallback-2026-07-01"]
        params["fallbacks"] = "default"
    resp = client().beta.messages.create(**params)
    if resp.stop_reason == "refusal":
        raise RuntimeError("Model declined the request (" + str(resp.stop_details) + ")")
    text = "".join(b.text for b in resp.content if b.type == "text")
    u = resp.usage
    return Reply(
        text=text,
        request_id=rid,
        latency_ms=(time.perf_counter() - start) * 1000,
        input_tokens=u.input_tokens,
        output_tokens=u.output_tokens,
        cache_read_tokens=getattr(u, "cache_read_input_tokens", 0) or 0,
        model=resp.model,
        raw=resp,
    )


if __name__ == "__main__":
    r = ask("In one sentence: what makes an AI system production-grade?")
    print(r.text)
    print(f"{r.request_id}  {r.latency_ms:.0f} ms  in={r.input_tokens} out={r.output_tokens}")
`},

"""HelpDesk Pilot: starter skeleton that wires the week modules together.

Fill in each TODO with your own module from that week. The flow is:
auth -> input guard -> retrieve -> route -> answer with citations -> groundedness -> output guard -> trace.
"""
import time
import uuid

from fastapi import Depends, FastAPI, Header, HTTPException
from pydantic import BaseModel

from common.llm import FAST_MODEL, MODEL, ask

app = FastAPI(title="HelpDesk Pilot")


class Question(BaseModel):
    text: str
    order_id: str | None = None


class AnswerOut(BaseModel):
    request_id: str
    answer: str
    citations: list[str]
    model: str
    policy_version: str
    latency_ms: int
    needs_approval: dict | None = None


def current_user(authorization: str = Header(...)):
    # TODO (week 5): verify the JWT, return {"sub", "tenant", "roles"} from claims only
    if not authorization.startswith("Bearer "):
        raise HTTPException(401, "missing token")
    return {"sub": "demo", "tenant": "acme", "roles": ["support"]}


def input_guard(text):
    # TODO (week 5): size limit, PII redaction for logs, injection hint scoring
    return len(text) < 4000


def retrieve(user, text):
    # TODO (week 2): hybrid BM25 + vector + RRF, filtered by user's tenant and roles
    return [{"id": "returns#window", "text": "Items can be returned within 30 days of delivery."}]


def route(text, chunks):
    # TODO (week 3): Haiku first, escalate to Opus on low confidence; use prompt caching
    return FAST_MODEL


def grounded(answer, chunks):
    # TODO (week 5): every number and claim must be supported by cited chunks
    return True


def trace(**fields):
    # TODO (week 4): emit a span with model, tokens, latency, policy version, guard results
    print(fields)


@app.get("/healthz")
def healthz():
    return {"ok": True}


@app.post("/ask", response_model=AnswerOut)
def ask_endpoint(q: Question, user=Depends(current_user)):
    rid, t0 = str(uuid.uuid4()), time.perf_counter()
    if not input_guard(q.text):
        raise HTTPException(400, "request not accepted")
    chunks = retrieve(user, q.text)
    model = route(q.text, chunks)
    policy_version = "v1"   # TODO (week 5): load the live prompt from the policy registry
    docs = [{"type": "document", "source": {"type": "text", "media_type": "text/plain", "data": c["text"]},
             "title": c["id"], "citations": {"enabled": True}} for c in chunks]
    reply = ask(docs + [{"type": "text", "text": q.text}],
                system="You are a support copilot. Answer only from the documents and cite them.",
                model=model, max_tokens=800, effort="low")
    if not grounded(reply.text, chunks):
        reply_text, cites = "I couldn't find a reliable answer. A teammate will follow up.", []
    else:
        reply_text, cites = reply.text, [c["id"] for c in chunks]
    # TODO (week 6): if the question needs a refund, run the supervised agent and return needs_approval
    ms = int((time.perf_counter() - t0) * 1000)
    trace(request_id=rid, user=user["sub"], model=model, policy=policy_version, ms=ms,
          in_tok=reply.input_tokens, out_tok=reply.output_tokens)
    return AnswerOut(request_id=rid, answer=reply_text, citations=cites, model=model,
                     policy_version=policy_version, latency_ms=ms)

body: `<p>A prototype answers "can this work?". A production system answers "will this keep working, for everyone, at 3 a.m., within budget, and can we prove it?". The model is usually the smallest part of the second answer.</p>
<h4>Two tracks, one discipline</h4>
<p>We follow two kinds of system all course. <b>Classic ML</b>: a fraud score or a product recommender, trained on your own data and served as a function from features to a number. <b>LLM applications</b>: a RAG assistant or an agent, built on a hosted or self-hosted foundation model and driven by prompts, retrieved context and tools. The patterns repeat: versioned inputs, a contract at every boundary, measurement before release, and a way back when it breaks.</p>
<h4>The lifecycle and its handoff artifacts</h4>
<p>Every stage hands the next one a concrete, versioned thing. If a handoff is "it's in my notebook", the next stage can't reproduce it.</p>
<div class="tablewrap"><table><thead><tr><th>Stage</th><th>Classic ML hands off</th><th>LLM app hands off</th></tr></thead><tbody>
<tr><td>Data</td><td>Dataset snapshot + schema + digest</td><td>Document corpus + chunking config + index version</td></tr>
<tr><td>Build</td><td>Trained model file + metrics + training code commit</td><td>Prompt template version + model id + eval scores</td></tr>
<tr><td>Package</td><td>Artifact with sha256 + model card</td><td>Service image with prompt and policy bundle</td></tr>
<tr><td>Serve</td><td>API contract (request and response schema)</td><td>API contract + streaming format + tool schemas</td></tr>
<tr><td>Monitor</td><td>Dashboards, alerts, drift reports</td><td>Traces, eval sampling, cost and groundedness reports</td></tr></tbody></table></div>
<h4>Training/serving skew</h4>
<p>Skew is when the model sees different inputs in production than it saw when it was built. Classic causes: features computed with different code online and offline, a timezone or unit mismatch, or a feature that leaks the label in training. The LLM version: you evaluated prompts against clean test documents, but production retrieves messy, truncated chunks. The fix is the same: one shared transformation function, used by training, evaluation and serving.</p>
<h4>Batch, online and streaming inference</h4>
<ul><li><b>Batch:</b> score everything on a schedule (nightly churn scores, weekly doc summaries). Cheapest, simplest, results are hours old.</li>
<li><b>Online:</b> score per request behind an API (card authorization, chat). Needs latency budgets, autoscaling and fallbacks.</li>
<li><b>Streaming:</b> score events as they arrive on a queue (clickstream recommendations). Fresh results without a user waiting on each call.</li></ul>
<h4>Monolith, microservices or event-driven</h4>
<p>Start as a <b>modular monolith</b>: one deployable with clear internal layers. Split into <b>microservices</b> when parts need to scale or release independently (the GPU model server versus the cheap API layer is the classic first split). Use <b>event-driven</b> designs when work is asynchronous and must survive spikes: a queue between "document uploaded" and "document indexed" absorbs a burst of 50,000 PDFs.</p>
<h4>Production building blocks</h4>
<ul><li><b>API gateway:</b> auth, rate limits, routing, request ids.</li>
<li><b>Feature store:</b> the same feature values offline (training) and online (serving), which kills a whole class of skew.</li>
<li><b>Vector database:</b> stores embeddings with metadata for retrieval.</li>
<li><b>Model registry:</b> versioned models and prompts with stages such as staging and production.</li></ul>`,

"""Demo: one feature function for batch and online paths, and a parity check."""
import json
from datetime import datetime, timezone

FEATURE_VERSION = "v3"


def featurize(txn: dict) -> dict:
    """The ONLY place features are computed. Training, batch and online all call this."""
    ts = datetime.fromisoformat(txn["ts"]).astimezone(timezone.utc)
    return {
        "amount_usd": round(float(txn["amount_cents"]) / 100, 2),
        "hour_utc": ts.hour,
        "is_night": int(ts.hour < 6),
        "country": txn["country"].upper()[:2],
        "feature_version": FEATURE_VERSION,
    }


def batch_job(rows):
    """Nightly: featurize a whole table (here, a list)."""
    return [featurize(r) for r in rows]


def online_handler(request_body: str):
    """Per request: parse JSON, featurize one row."""
    return featurize(json.loads(request_body))


if __name__ == "__main__":
    rows = [
        {"ts": "2026-11-03T02:15:00+05:30", "amount_cents": 12999, "country": "in"},
        {"ts": "2026-11-03T18:40:00-08:00", "amount_cents": 450, "country": "US"},
    ]
    offline = batch_job(rows)
    online = [online_handler(json.dumps(r)) for r in rows]
    for a, b in zip(offline, online):
        assert a == b, f"SKEW: {a} != {b}"
    print("parity check passed for", len(rows), "rows")
    print(json.dumps(offline, indent=2))

"""Lab: hunt the training/serving skew."""
from datetime import datetime, timezone


def train_featurize(t):
    ts = datetime.fromisoformat(t["ts"]).astimezone(timezone.utc)
    return {"amount_usd": t["amount_cents"] / 100, "hour": ts.hour, "country": t["country"].upper()}


def online_featurize(t):
    # Written separately "for speed". Spot the bugs.
    ts = datetime.fromisoformat(t["ts"])               # bug? no timezone conversion
    return {"amount_usd": t["amount_cents"] // 100,     # bug? integer division
            "hour": ts.hour,
            "country": t["country"]}                     # bug? no normalization


ROWS = [
    {"ts": "2026-11-03T02:15:00+05:30", "amount_cents": 12999, "country": "in"},
    {"ts": "2026-11-03T18:40:00-08:00", "amount_cents": 450, "country": "US"},
]

if __name__ == "__main__":
    mismatches = 0
    for r in ROWS:
        a, b = train_featurize(r), online_featurize(r)
        for k in a:
            if a[k] != b[k]:

focus: "designing a retry and fallback policy for an LLM call that sometimes takes 40 seconds",
body: `<p>Model calls fail in ways normal functions don't: they are slow, rate limited, and occasionally return nothing useful. Four primitives turn that into a reliable service.</p>
<h4>Timeouts</h4>
<p>Every network call gets a deadline, and the deadline comes from the user's budget, not the library default. If a chat reply must start within 3 seconds, the retrieval call might get 400 ms and the model call the rest. A call without a timeout is a thread you may never get back.</p>
<h4>Retries with backoff, jitter and a budget</h4>
<p>Retry only what can succeed on a second try: timeouts, connection errors, HTTP 429 and 5xx. Never retry a 400; it will fail the same way. Wait longer each time (exponential backoff) and add randomness (jitter) so a thousand clients don't retry in lockstep. Then cap the total: a <b>retry budget</b> says, for example, that retries may add at most 10% extra traffic. Without a budget, retries turn a small outage into a big one.</p>
<h4>Queues</h4>
<p>A queue decouples "work was requested" from "work was done". Use it when the caller doesn't need the answer right now: indexing documents, generating reports, batch scoring. Queues absorb spikes, let you retry safely, and make it easy to add workers.</p>
<h4>Graceful degradation</h4>
<p>Decide in advance what a worse-but-useful answer looks like. A recommender falls back to "popular this week". A RAG assistant falls back to showing the top three source documents without a generated summary. A fraud model that times out falls back to a rules engine. Users forgive a simpler answer far more than an error page.</p>
<h4>REST, gRPC and streaming</h4>
<ul><li><b>REST + JSON:</b> universal, easy to debug, ideal for public and partner APIs.</li>
<li><b>gRPC + Protobuf:</b> typed contracts, smaller payloads and lower latency between internal services, such as API layer to model server.</li>
<li><b>Streaming:</b> for LLMs, send tokens as they are generated (server-sent events over HTTP, or gRPC streams). Time to first token drops from seconds to a few hundred milliseconds, which is what users perceive as speed.</li></ul>`,

"""Demo: timeouts, jittered backoff, a retry budget and graceful degradation."""
import random
import time

random.seed(7)


class TransientError(Exception):
    pass


class RetryBudget:
    """Allow retries up to ratio * requests (plus a small floor)."""

    def __init__(self, ratio=0.1, floor=3):
        self.ratio, self.floor = ratio, floor
        self.requests = self.retries = 0

    def record_request(self):
        self.requests += 1

    def can_retry(self):
        return self.retries < self.floor + self.ratio * self.requests

    def spend(self):
        self.retries += 1


def flaky_model(prompt):
    if random.random() < 0.35:
        raise TransientError("503 overloaded")
    time.sleep(random.uniform(0.01, 0.05))
    return f"answer to {prompt!r}"


def degraded(prompt):
    return f"(degraded) top help articles for {prompt!r}"


def call_with_policy(prompt, budget, deadline_s=0.5, max_attempts=3, base=0.02):
    budget.record_request()
    start = time.monotonic()
    for attempt in range(1, max_attempts + 1):
        try:
            return flaky_model(prompt), attempt
        except TransientError:
            out_of_time = time.monotonic() - start > deadline_s
            if attempt == max_attempts or out_of_time or not budget.can_retry():
                return degraded(prompt), attempt
            budget.spend()
            time.sleep(random.uniform(0, base * 2 ** attempt))  # full jitter


if __name__ == "__main__":
    budget = RetryBudget()
    stats = {"ok_first": 0, "ok_retry": 0, "degraded": 0}
    for i in range(40):
        out, attempts = call_with_policy(f"q{i}", budget)
        key = "degraded" if out.startswith("(degraded)") else ("ok_first" if attempts == 1 else "ok_retry")
        stats[key] += 1
    print(stats)
    print(f"requests={budget.requests} retries={budget.retries} "
          f"extra load={budget.retries / budget.requests:.0%}")
`},

body: `<p>This lesson turns a script into a service you would let a teammate operate. Live demo of the week: the same model goes from notebook to versioned artifact to API to container image.</p>
<h4>Layered service architecture</h4>
<ul><li><b>API layer:</b> HTTP routes, request validation, auth, request ids. No business rules.</li>
<li><b>Domain layer:</b> the use case ("score this transaction", "answer with citations"). Pure Python, easy to test.</li>
<li><b>Model adapters:</b> one class per model backend (local artifact, Claude API, self-hosted server). Swapping a model touches only this layer.</li></ul>
<h4>Configuration and secrets</h4>
<p>Config (model id, timeouts, feature flags) comes from environment variables or a config file and is logged at startup. Secrets (API keys, database passwords) come from a secret manager or injected environment variables, are never committed, and are never logged. One rule of thumb: you should be able to print your whole config object safely.</p>
<h4>Request ids and retry budgets</h4>
<p>Accept an incoming <code>X-Request-ID</code> or create one, put it in every log line, and pass it to downstream calls. When a user reports "it broke at 10:42", the request id takes you from the gateway log to the model call in one search. Retry budgets from lesson 1.2 live in the model adapter, shared across requests.</p>
<h4>Async for I/O-bound work</h4>
<p>LLM and retrieval calls spend almost all their time waiting on the network. With <code>async</code>/<code>await</code>, one process handles hundreds of waiting requests and can run independent calls concurrently, such as vector search and keyword search at the same time. CPU-heavy work (local model inference, PDF parsing) belongs in worker processes, not the event loop.</p>
<h4>Structured logs and health endpoints</h4>
<p>Log JSON, one event per line, with fields such as <code>request_id</code>, <code>route</code>, <code>latency_ms</code>, <code>model</code>, <code>tokens</code>. Expose <code>/healthz</code> (liveness: the process is running) and <code>/readyz</code> (readiness: the model artifact loaded, its hash matches, dependencies reachable). Kubernetes restarts a pod that fails liveness and stops sending traffic to one that fails readiness.</p>
<h4>Versioned model artifacts</h4>
<p>Serialize the model, then write a manifest next to it: name, version, sha256 of the file, training commit, data digest, metrics, and the feature version. At startup the service recomputes the hash and refuses to become ready if it doesn't match. This catches the wrong file, a partial download and silent tampering.</p>
<h4>The packaging path and containers</h4>
<p>Notebook → script with a <code>train()</code> function → artifact + manifest → API that loads the artifact → container image tagged with the git commit. Docker images bundle the Python version, dependencies and code, so "works on my machine" becomes "works in this image". Kubernetes then runs N copies of the image, restarts failures, rolls out new versions and scales on load. You will deploy to it in week 6; for now, know the vocabulary: pod, deployment, service, probe, resource requests.</p>`,

"""Demo: a production-shaped AI service (API -> domain -> model adapter)."""
import asyncio
import hashlib
import json
import logging
import os
import pickle
import time
import uuid
from pathlib import Path

from fastapi import FastAPI, Request
from pydantic import BaseModel

from common.llm import ask

# ---------- config (safe to log) ----------
CONFIG = {
    "artifact_path": os.getenv("ARTIFACT_PATH", "week1/service/model.pkl"),
    "model_timeout_s": float(os.getenv("MODEL_TIMEOUT_S", "20")),
    "service_version": os.getenv("SERVICE_VERSION", "dev"),
}

logging.basicConfig(level=logging.INFO, format="%(message)s")
log = logging.getLogger("svc")


def jlog(**fields):
    log.info(json.dumps(fields))


# ---------- artifact: write once, verify at startup ----------
def sha256(path):
    return hashlib.sha256(Path(path).read_bytes()).hexdigest()


def build_artifact(path):
    model = {"weights": {"amount_usd": 0.004, "is_night": 0.9}, "bias": -2.0}
    Path(path).write_bytes(pickle.dumps(model))
    manifest = {"name": "fraud-lite", "version": "1.0.0", "sha256": sha256(path),
                "feature_version": "v3", "created": time.time()}
    Path(path + ".json").write_text(json.dumps(manifest, indent=2))


class FraudAdapter:
    """Model adapter: the only class that knows how the model is stored."""

    def __init__(self, path):
        self.manifest = json.loads(Path(path + ".json").read_text())
        if sha256(path) != self.manifest["sha256"]:
            raise RuntimeError("artifact hash mismatch")
        self.model = pickle.loads(Path(path).read_bytes())  # only load artifacts you built

    def score(self, feats):
        z = self.model["bias"] + sum(self.model["weights"].get(k, 0) * v for k, v in feats.items())
        return round(1 / (1 + 2.718281828 ** -z), 4)


# ---------- domain ----------
class Txn(BaseModel):
    amount_usd: float
    is_night: int


async def explain_score(txn: Txn, score: float) -> str:
    prompt = f"In one sentence for a fraud analyst, explain a risk score of {score} for {txn.model_dump()}."
    reply = await asyncio.wait_for(asyncio.to_thread(ask, prompt, max_tokens=300, effort="low"),
                                   timeout=CONFIG["model_timeout_s"])
    return reply.text


# ---------- API ----------
app = FastAPI()
STATE = {"adapter": None, "error": None}


@app.on_event("startup")
def load():
    jlog(event="startup", config=CONFIG)
    if not Path(CONFIG["artifact_path"]).exists():
        build_artifact(CONFIG["artifact_path"])
    try:
        STATE["adapter"] = FraudAdapter(CONFIG["artifact_path"])
    except Exception as e:  # stay alive, but not ready
        STATE["error"] = str(e)


@app.middleware("http")
async def request_id(request: Request, call_next):
    rid = request.headers.get("x-request-id", "req_" + uuid.uuid4().hex[:12])
    start = time.perf_counter()
    response = await call_next(request)
    response.headers["x-request-id"] = rid
    jlog(request_id=rid, route=request.url.path, status=response.status_code,
         latency_ms=round((time.perf_counter() - start) * 1000, 1))
    return response


@app.get("/healthz")
def healthz():
    return {"status": "alive"}


@app.get("/readyz")
def readyz():
    if STATE["adapter"] is None:
        return {"ready": False, "reason": STATE["error"] or "loading"}
    return {"ready": True, "model": STATE["adapter"].manifest}


@app.post("/score")
async def score(txn: Txn, explain: bool = False):
    s = STATE["adapter"].score(txn.model_dump())
    out = {"score": s, "model_version": STATE["adapter"].manifest["version"]}
    if explain:
        try:
            out["explanation"] = await explain_score(txn, s)
        except asyncio.TimeoutError:
            out["explanation"] = None  # degrade: score still returned
    return out

# ---------- Dockerfile (save as week1/service/Dockerfile) ----------
# FROM python:3.12-slim
# WORKDIR /app
# COPY requirements.txt .
# RUN pip install --no-cache-dir -r requirements.txt
# COPY common/ common/
# COPY week1/ week1/
# ENV PYTHONPATH=/app SERVICE_VERSION=GIT_SHA_HERE
# EXPOSE 8000
# CMD ["uvicorn", "week1.service.app:app", "--host", "0.0.0.0", "--port", "8000"]
#
# Try it:  curl -s localhost:8000/readyz
#          curl -s -X POST "localhost:8000/score?explain=true" -H "content-type: application/json" \
#               -d '{"amount_usd": 900, "is_night": 1}'
`},

id: "2.1", title: "Data pipelines, validation gates and lineage", mins: 60, kicker: "ingestion, ETL vs ELT, schemas, lineage, parity, leakage, DL data paths",
focus: "where to place validation gates in a pipeline that feeds both a fraud model and a RAG index",
body: `<p>Most production AI incidents start as data incidents. A pipeline's job is to deliver data that is correct, versioned and explainable, and to stop loudly when it isn't.</p>
<h4>Ingestion patterns</h4>
<ul><li><b>Batch:</b> pull a full or incremental extract on a schedule. Simple to reason about and to rerun.</li>
<li><b>Streaming:</b> consume events continuously (Kafka, Kinesis, Pub/Sub). Needed for fresh features such as "transactions in the last 10 minutes".</li>
<li><b>ETL</b> transforms before loading into the warehouse; <b>ELT</b> loads raw data first and transforms inside the warehouse with SQL (dbt). ELT keeps the raw copy, which makes reprocessing and audits much easier.</li></ul>
<h4>Validation gates and schema enforcement</h4>
<p>A gate is a check that blocks the pipeline instead of logging a warning. Put one at ingestion (schema, types, required fields), one before training (row counts, null rates, value ranges, class balance) and one before serving (feature ranges match training). Typical tools: Pydantic or Pandera for schemas, Great Expectations for dataset checks. For documents: reject files that fail to parse, are empty, or are in an unexpected language.</p>
<h4>Lineage and versioning</h4>
<p>Lineage answers "which data, code and config produced this model or this index?". Version datasets by content hash (DVC, lakeFS, Delta or Iceberg table versions) and record the hash in every downstream artifact. For RAG, version the corpus snapshot, the chunking config and the embedding model together: changing any one of them changes the answers.</p>
<h4>Parity and leakage</h4>
<p>Training/serving parity means the same transformation code and the same point-in-time view of data. <b>Leakage</b> is when training data contains information that won't exist at prediction time: a "chargeback_flag" column that is only filled weeks after the transaction, or a random split that puts the same customer in train and test. Leakage shows up as offline scores that are too good to be true. Use time-based splits and point-in-time joins.</p>
<h4>Deep-learning data paths</h4>
<p>For neural models the data path is part of performance: loaders that read sharded files in parallel, batching that keeps the GPU busy, augmentation applied on the fly (and only on training data), and distributed training where each worker reads a different shard. A slow loader shows up as low GPU utilization, not as an error.</p>`,

"""Demo: schema gate, quality gate, dataset digest and a leakage scan."""
import hashlib
import json
from typing import Literal

from pydantic import BaseModel, ValidationError, field_validator


class Txn(BaseModel):
    txn_id: str
    amount_usd: float
    country: str
    channel: Literal["web", "app", "pos"]
    label_fraud: int
    chargeback_flag: int  # only known weeks later -> leakage candidate

    @field_validator("amount_usd")
    @classmethod
    def positive(cls, v):
        if v <= 0 or v > 50_000:
            raise ValueError("amount out of range")
        return v


def schema_gate(rows):
    good, bad = [], []
    for r in rows:
        try:
            good.append(Txn(**r))
        except ValidationError as e:
            bad.append((r.get("txn_id"), e.errors()[0]["msg"]))
    return good, bad


def quality_gate(rows, max_bad_ratio=0.02):
    good, bad = schema_gate(rows)
    ratio = len(bad) / max(len(rows), 1)
    if ratio > max_bad_ratio:
        raise SystemExit(f"BLOCKED: {ratio:.0%} invalid rows (limit {max_bad_ratio:.0%}): {bad[:3]}")
    return good


def digest(rows):
    blob = json.dumps([r.model_dump() for r in rows], sort_keys=True).encode()
    return hashlib.sha256(blob).hexdigest()[:16]


def leakage_scan(rows, label="label_fraud"):
    """Flag any feature that alone predicts the label almost perfectly."""
    keys = [k for k in rows[0].model_dump() if k not in (label, "txn_id")]
    for k in keys:
        vals = [(getattr(r, k), getattr(r, label)) for r in rows]
        agree = sum(1 for v, y in vals if (v == y) or (isinstance(v, (int, float)) and int(v > 0) == y))
        if agree / len(vals) > 0.98:
            print(f"  LEAKAGE? feature '{k}' matches the label {agree}/{len(vals)} times")


if __name__ == "__main__":
    batch = [{"txn_id": f"t{i}", "amount_usd": 20 + i, "country": "US", "channel": "web",
              "label_fraud": i % 7 == 0, "chargeback_flag": i % 7 == 0} for i in range(200)]
    rows = quality_gate(batch)
    print("accepted", len(rows), "rows, digest", digest(rows))
    leakage_scan(rows)

    broken = batch[:50] + [{"txn_id": "x1", "amount_usd": -5, "country": "US", "channel": "fax",
                             "label_fraud": 0, "chargeback_flag": 0}] * 5
    quality_gate(broken)
`},

body: `<p>Retrieval quality caps answer quality. If the right passage isn't retrieved, no prompt can save the answer. This lesson covers the ingestion half of RAG.</p>
<h4>Document parsing</h4>
<ul><li><b>Digital PDFs:</b> extract text with layout (pypdf, pdfplumber, PyMuPDF). Tables need special handling; keep them as Markdown or rows.</li>
<li><b>Scanned PDFs and images:</b> OCR (Tesseract, cloud document AI services) or a vision-capable model. Store the OCR confidence; low-confidence pages need review.</li>
<li><b>HTML:</b> strip navigation, footers and cookie banners; keep headings because they carry meaning.</li>
<li>Keep the source location (file, page, section) for every piece of text. You need it for citations and access control later.</li></ul>
<h4>Chunking strategies</h4>
<div class="tablewrap"><table><thead><tr><th>Strategy</th><th>How</th><th>Good for</th></tr></thead><tbody>
<tr><td>Fixed size + overlap</td><td>e.g. 400 tokens, 60 overlap</td><td>Quick baseline, uniform text</td></tr>
<tr><td>Structure-aware</td><td>split on headings, list items, table rows</td><td>Policies, manuals, docs sites</td></tr>
<tr><td>Semantic</td><td>split where topic similarity drops</td><td>Long narrative text</td></tr>
<tr><td>Parent–child</td><td>retrieve small chunks, return the larger parent section</td><td>Precise matching with enough context</td></tr></tbody></table></div>
<p>Prefix each chunk with its document title and heading path ("Travel Policy › Meals › International"). It costs a few tokens and makes both keyword and vector search much better.</p>
<h4>Vector database operations</h4>
<ul><li><b>Indexing:</b> embed chunks and store vector + text + metadata. Approximate indexes (HNSW, IVF) trade a little recall for speed.</li>
<li><b>Upserts:</b> use stable chunk ids (doc id + chunk number + content hash) so re-ingesting an edited document replaces old chunks instead of duplicating them. Delete chunks of removed documents.</li>
<li><b>Metadata filters:</b> filter by department, region, document date or access group <i>before</i> similarity ranking, so users only ever retrieve what they may see.</li>
<li>Re-embed everything when you change the embedding model; vectors from two models are not comparable.</li></ul>`,

"""Demo: structure-aware chunking, stable ids, upserts and filtered search."""
import hashlib
import math
import re

DOCS = {
    "travel-policy": {"dept": "finance", "text": """# Travel Policy
## Meals
Domestic meals are reimbursed up to 60 USD per day with receipts.
## Meals > International
International meals are reimbursed up to 90 USD per day.
## Flights
Economy class for flights under 6 hours. Premium economy above 6 hours."""},
    "security-handbook": {"dept": "it", "text": """# Security Handbook
## Passwords
Use a password manager. Rotate service credentials every 90 days.
## Laptops
Full-disk encryption is mandatory on every company laptop."""},
}


def chunk_by_headings(doc_id, text):
    title, path, chunks = "", [], []
    for block in re.split(r"\n(?=#)", text.strip()):
        head, _, body = block.partition("\n")
        level = len(head) - len(head.lstrip("#"))
        name = head.lstrip("# ").strip()
        if level == 1:
            title = name
            continue
        path = [name]
        content = f"{title} > {' > '.join(path)}: {body.strip()}"
        cid = f"{doc_id}:{hashlib.sha256(content.encode()).hexdigest()[:10]}"
        chunks.append({"id": cid, "doc_id": doc_id, "text": content})
    return chunks


def embed(text, dim=256):
    """Toy embedding: hashed bag of words, L2 normalized. Replace with a real model."""
    v = [0.0] * dim
    for w in re.findall(r"[a-z0-9]+", text.lower()):
        v[int(hashlib.md5(w.encode()).hexdigest(), 16) % dim] += 1
    n = math.sqrt(sum(x * x for x in v)) or 1
    return [x / n for x in v]


class VectorIndex:
    def __init__(self):
        self.rows = {}

    def upsert_document(self, doc_id, chunks, meta):
        stale = [k for k, r in self.rows.items() if r["doc_id"] == doc_id and k not in {c["id"] for c in chunks}]
        for k in stale:
            del self.rows[k]
        for c in chunks:
            self.rows[c["id"]] = {**c, **meta, "vec": embed(c["text"])}
        return len(chunks), len(stale)

    def search(self, query, k=3, where=None):
        q = embed(query)
        cands = [r for r in self.rows.values() if all(r.get(f) == v for f, v in (where or {}).items())]
        scored = sorted(cands, key=lambda r: -sum(a * b for a, b in zip(q, r["vec"])))
        return scored[:k]


if __name__ == "__main__":
    idx = VectorIndex()
    for doc_id, d in DOCS.items():
        print(doc_id, "upserted/removed:", idx.upsert_document(doc_id, chunk_by_headings(doc_id, d["text"]), {"dept": d["dept"]}))

    DOCS["travel-policy"]["text"] = DOCS["travel-policy"]["text"].replace("90 USD", "100 USD")
    print("re-ingest after edit:", idx.upsert_document("travel-policy", chunk_by_headings("travel-policy", DOCS["travel-policy"]["text"]), {"dept": "finance"}))

    for r in idx.search("international meal allowance", where={"dept": "finance"}):
        print(" ->", r["id"], "|", r["text"][:80])
`},

body: `<p>Live demo of the week: a RAG pipeline that answers from company documents with citations. This lesson covers the query half.</p>
<h4>Why hybrid</h4>
<p><b>BM25</b> (keyword scoring) is excellent at exact terms: product codes, error ids, names, "Form W-8BEN". <b>Dense embeddings</b> match meaning: "money back" finds "refund". Each fails where the other shines, so production systems run both and merge the lists. <b>Reciprocal rank fusion (RRF)</b> is the simplest merge: score = Σ 1 / (60 + rank) across lists. It needs no score normalization.</p>
<h4>Reranking</h4>
<p>First-stage retrieval is fast and approximate; take the top 30–50 candidates. A <b>reranker</b> (a cross-encoder, or an LLM asked to score relevance) then reads query and passage together and reorders them. Rerankers are slower per item but far more accurate, so they only see the short list.</p>
<h4>Context packaging</h4>
<ul><li><b>Ordering:</b> put the most relevant passages first; models attend best to the start and end of long contexts.</li>
<li><b>Token caps:</b> set a budget (say 6,000 tokens of context), add passages until it's spent, and never cut one mid-sentence.</li>
<li><b>Deduplicate</b> near-identical chunks so you don't spend the budget twice.</li>
<li><b>Citations:</b> give each passage an id and source. With Claude you can pass passages as <code>document</code> blocks with citations enabled; the response then links each claim to the exact cited text, which you can show users and check automatically.</li></ul>
<h4>GraphRAG</h4>
<p>Some questions need relationships, not passages: "Which suppliers of our EU plants had quality incidents last year?". GraphRAG extracts entities and relations into a knowledge graph, then retrieves connected subgraphs or community summaries. Use it when questions are multi-hop or about the whole corpus; it costs more to build and keep fresh than plain RAG.</p>
<div class="callout"><span class="eyebrow">Go further</span><div>Agentic retrieval: let the model call a <code>search</code> tool several times, refining the query each time, instead of one fixed retrieval step. You'll build tool loops in week 6.</div></div>`,

"""Demo: hybrid retrieval (BM25 + vectors + RRF) and a cited answer from Claude."""
import math
import re
from collections import Counter

from common.llm import OFFLINE, ask
from week2.ingest import DOCS, chunk_by_headings, embed

CHUNKS = [c for d, v in DOCS.items() for c in chunk_by_headings(d, v["text"])]
tok = lambda s: re.findall(r"[a-z0-9]+", s.lower())


class BM25:
    def __init__(self, docs, k1=1.5, b=0.75):
        self.docs = [tok(d["text"]) for d in docs]
        self.avg = sum(map(len, self.docs)) / len(self.docs)
        self.df = Counter(w for d in self.docs for w in set(d))
        self.k1, self.b, self.n = k1, b, len(self.docs)

    def scores(self, query):
        out = []
        for d in self.docs:
            tf, s = Counter(d), 0.0
            for w in tok(query):
                if w not in tf:
                    continue
                idf = math.log(1 + (self.n - self.df[w] + 0.5) / (self.df[w] + 0.5))
                s += idf * tf[w] * (self.k1 + 1) / (tf[w] + self.k1 * (1 - self.b + self.b * len(d) / self.avg))
            out.append(s)
        return out


def rrf(*rankings, k=60):
    fused = Counter()
    for ranking in rankings:
        for rank, idx in enumerate(ranking):
            fused[idx] += 1 / (k + rank + 1)
    return [i for i, _ in fused.most_common()]


def retrieve(query, top=4):
    bm = BM25(CHUNKS).scores(query)
    bm_rank = sorted(range(len(CHUNKS)), key=lambda i: -bm[i])
    qv = embed(query)
    dv_rank = sorted(range(len(CHUNKS)), key=lambda i: -sum(a * b for a, b in zip(qv, embed(CHUNKS[i]["text"]))))
    return [CHUNKS[i] for i in rrf(bm_rank, dv_rank)[:top]]


def pack(chunks, max_tokens=1500):
    out, used, seen = [], 0, set()
    for c in chunks:
        cost = len(c["text"]) // 4 + 20      # rough token estimate
        if c["text"] in seen or used + cost > max_tokens:
            continue
        seen.add(c["text"])
        used += cost
        out.append(c)
    return out


def answer(question):
    ctx = pack(retrieve(question))
    docs = [{"type": "document", "source": {"type": "text", "media_type": "text/plain", "data": c["text"]},
             "title": c["id"], "citations": {"enabled": True}} for c in ctx]
    if OFFLINE:
        return "[offline] would answer from: " + ", ".join(c["id"] for c in ctx), []
    reply = ask(docs + [{"type": "text", "text": question + "\nAnswer only from the documents. If they don't say, reply 'Not in the policy.'"}],
                max_tokens=800, effort="low")
    cites = []
    for block in reply.raw.content:
        for cit in getattr(block, "citations", None) or []:
            cites.append((cit.document_title, cit.cited_text))
    return reply.text, cites


if __name__ == "__main__":
    text, cites = answer("What is the daily meal limit when travelling internationally?")
    print(text)
    for title, quote in cites:
        print(f"  [{title}] \"{quote}\"")
`},

id: "2.4", title: "Model development, reproducibility and adaptation choices", mins: 55, kicker: "experiment tracking, registry stages, tuning, reproducibility, prompting vs RAG vs LoRA vs fine-tuning",
focus: "deciding whether a legal-clause classifier needs fine-tuning or better prompts plus retrieval",
body: `<h4>Experiment tracking</h4>
<p>Every training or prompt experiment logs its parameters, metrics, code commit, data digest and output artifact. MLflow and Weights & Biases do this with a few lines; for prompt work, log the prompt version, model id, effort level and eval scores the same way. The question you must be able to answer in 30 seconds: "what exactly produced the model in production?"</p>
<h4>Model registry stages</h4>
<p>A registry holds versioned models (and, for LLM apps, prompt bundles) with a stage: <b>None → Staging → Production → Archived</b>. Promotion is a deliberate act with checks: eval gate passed, model card written, owner approved. Rollback is "promote the previous version", which takes seconds.</p>
<h4>Hyperparameter tuning</h4>
<p>Start with sensible defaults, then search the few parameters that matter (learning rate, depth, regularization). Random search beats grid search for the same budget; Bayesian tools (Optuna) are better still. Always tune on a validation split and report the final number on an untouched test split.</p>
<h4>Reproducibility checklist</h4>
<ul><li>Code: git commit hash, clean working tree.</li><li>Data: dataset digest or table version.</li><li>Environment: locked dependencies (<code>uv.lock</code>, <code>requirements.txt</code> with hashes) and the container image digest.</li><li>Randomness: seeds recorded.</li><li>Artifact: link from the run to the registry version and its sha256.</li></ul>

"""Demo: reproducible runs and a minimal model registry with stages."""
import hashlib
import json
import platform
import random
import subprocess
import time
from pathlib import Path

LOG = Path("week2/runs.jsonl")
REGISTRY = Path("week2/registry.json")


def git_commit():
    try:
        return subprocess.check_output(["git", "rev-parse", "--short", "HEAD"], text=True).strip()
    except Exception:
        return "no-git"


def file_digest(path):
    p = Path(path)
    return hashlib.sha256(p.read_bytes()).hexdigest()[:12] if p.exists() else "missing"


def train(params, seed):
    random.seed(seed)
    # stand-in for real training: accuracy depends on params plus noise
    acc = 0.80 + 0.05 * (params["depth"] / 10) - abs(params["lr"] - 0.1) + random.uniform(-0.01, 0.01)
    return {"val_accuracy": round(acc, 4)}


def log_run(params, seed=42, data_path="week2/train.csv"):
    run = {
        "run_id": f"run_{int(time.time() * 1000)}",
        "commit": git_commit(),
        "data_digest": file_digest(data_path),
        "env_lock": file_digest("requirements.txt"),
        "python": platform.python_version(),
        "seed": seed,
        "params": params,
        "metrics": train(params, seed),
    }
    with LOG.open("a") as f:
        f.write(json.dumps(run) + "\n")
    return run


def promote(run, stage, min_accuracy=0.84):
    reg = json.loads(REGISTRY.read_text()) if REGISTRY.exists() else {"versions": []}
    if stage == "Production" and run["metrics"]["val_accuracy"] < min_accuracy:
        print(f"  gate: {run['run_id']} blocked ({run['metrics']['val_accuracy']} < {min_accuracy})")
        return
    for v in reg["versions"]:
        if v["stage"] == stage:
            v["stage"] = "Archived"
    reg["versions"].append({"version": len(reg["versions"]) + 1, "run_id": run["run_id"], "stage": stage})
    REGISTRY.write_text(json.dumps(reg, indent=2))
    print(f"  {run['run_id']} -> {stage}")


if __name__ == "__main__":
    for params in [{"depth": 4, "lr": 0.3}, {"depth": 8, "lr": 0.1}, {"depth": 10, "lr": 0.12}]:
        r = log_run(params)
        print(r["run_id"], r["params"], r["metrics"])
        promote(r, "Staging")
        promote(r, "Production")
    print(REGISTRY.read_text())
`},

body: `<h4>Dedicated inference services</h4>
<p>Put the model behind its own service, separate from the API layer. The API layer is cheap, stateless and scales on CPU; the inference service is expensive, often GPU-bound, and scales on queue depth or tokens per second. Separating them lets each scale and deploy on its own schedule.</p>
<h4>Serving frameworks at a glance</h4>
<div class="tablewrap"><table><thead><tr><th>Framework</th><th>Best at</th></tr></thead><tbody>
<tr><td>NVIDIA Triton</td><td>Many model types (ONNX, TensorRT, PyTorch) on GPUs, dynamic batching, model ensembles</td></tr>
<tr><td>TorchServe</td><td>Straightforward PyTorch model serving with handlers</td></tr>
<tr><td>Ray Serve</td><td>Python-native composition of several models and business logic, autoscaling</td></tr>
<tr><td>vLLM</td><td>High-throughput LLM serving: PagedAttention, continuous batching, OpenAI-style API</td></tr>
<tr><td>SGLang</td><td>LLM serving with fast structured generation and prefix (radix) caching for repeated prompts</td></tr></tbody></table></div>
<h4>Prefill vs decode</h4>
<p>An LLM request has two phases. <b>Prefill</b> reads the whole prompt in parallel; it is <b>compute-bound</b> and sets time to first token. <b>Decode</b> generates one token at a time, rereading the model weights and the KV cache for every token; it is <b>memory-bandwidth-bound</b> and sets tokens per second. Long prompts hurt first-token latency; long outputs hurt total latency. That is why trimming context and capping output length are the first optimizations.</p>
<h4>Topologies</h4>
<ul><li><b>Single model:</b> simplest; fine until cost or latency forces more.</li>
<li><b>Router / gateway:</b> one entry point that picks a model per request (by task, tenant or size) and centralizes auth, quotas, logging and cost tracking.</li>
<li><b>Cascade with fallbacks:</b> try a small fast model first, escalate to a larger one when confidence is low or a check fails; on errors or refusals, fall back to another model or the degraded path.</li></ul>
<h4>Self-host vs managed API</h4>
<p>Managed APIs (such as Claude) give you frontier models, no GPU operations and per-token pricing; you trade off rate limits, vendor dependence and where data is processed (check data residency and retention terms). Self-hosting open models gives control and can be cheaper at very high, steady volume, but you pay for idle GPUs, on-call, upgrades and evaluation. Do the unit economics: cost per 1,000 requests at your real traffic shape, including engineers' time.</p>`,

"""Demo: a cost-aware cascade router with escalation and logging."""
import json
import time

from common.llm import FAST_MODEL, MODEL, OFFLINE, ask

PRICE = {  # USD per 1M tokens (input, output); check current pricing for your account
    "claude-haiku-5-5": (0.10, 0.50),
    "claude-opus-5-5": (4.00, 20.00),
}

SCHEMA = {
    "type": "object",
    "properties": {"answer": {"type": "string"}, "confidence": {"type": "number"}},
    "required": ["answer", "confidence"],
    "additionalProperties": False,
}


def cost(model, r):
    pin, pout = PRICE.get(model, (0, 0))
    return (r.input_tokens * pin + r.output_tokens * pout) / 1e6


def try_model(model, question):
    t = time.perf_counter()
    if OFFLINE:
        conf = 0.4 if "itinerary" in question else 0.9
        return {"answer": f"[{model}] stub", "confidence": conf}, 0.0, (time.perf_counter() - t) * 1000
    r = ask(f"Answer briefly and rate your confidence 0-1.\nQuestion: {question}",
            model=model, max_tokens=600, effort="low",
            output_config={"effort": "low", "format": {"type": "json_schema", "schema": SCHEMA}})
    return json.loads(r.text), cost(model, r), r.latency_ms


def route(question, threshold=0.75):
    hops = []
    out, usd, ms = try_model(FAST_MODEL, question)
    hops.append((FAST_MODEL, out["confidence"], usd, ms))
    if out["confidence"] < threshold:
        out, usd2, ms2 = try_model(MODEL, question)
        hops.append((MODEL, out["confidence"], usd2, ms2))
    return out["answer"], hops


if __name__ == "__main__":
    for q in ["What time zone is Lisbon in?",
              "Plan a 4-day rail itinerary from Lisbon to Barcelona with one rest day."]:
        ans, hops = route(q)
        print(q)
        for m, c, usd, ms in hops:
            print(f"   {m:18s} conf={c:.2f}  {usd:.5f} USD  {ms:.0f} ms")
        print("   ->", ans[:120])
`},

body: `<p>Live demo of the week: make the assistant faster and cheaper, and prove it with numbers. No optimization counts until a benchmark shows it.</p>
<h4>Profiling and baselines</h4>
<p>Measure a realistic request mix and record <b>p50</b> (typical), <b>p95</b> and <b>p99</b> (the tail users complain about), time to first token, tokens per second, error rate and cost per request. Break latency into stages: gateway, retrieval, rerank, model prefill, model decode, post-processing. Optimize the biggest stage first; averages hide the tail.</p>
<h4>Caching, from cheapest to cleverest</h4>
<ul><li><b>Exact response cache:</b> same normalized input, same answer. Great for FAQs and repeated tool calls.</li>
<li><b>Prompt (prefix) caching:</b> the provider caches the processed long, stable start of your prompt (system prompt, tool definitions, a big document). Later requests that share the prefix skip most of that prefill and cost less. With Claude you mark the stable prefix with <code>cache_control</code> and check <code>cache_read_input_tokens</code> in the usage to confirm hits. Keep anything variable (timestamps, user ids) after the cached part.</li>
<li><b>Semantic cache:</b> embed the question and reuse an answer for a sufficiently similar past question. Big savings for repetitive traffic, but a loose threshold returns wrong answers; scope the cache per tenant and per document version, and evaluate the threshold on real paraphrase pairs.</li></ul>
<h4>Batching</h4>
<p><b>Dynamic batching</b> waits a few milliseconds to group requests into one GPU pass; the batch runs until every member finishes. <b>Continuous batching</b> (vLLM, SGLang, TGI) adds and removes sequences at every decode step, so short answers don't wait for long ones; it raises throughput several times for LLMs. For offline work, provider batch APIs (such as Claude's Message Batches) trade latency for roughly half the price.</p>
<h4>Autoscaling signals</h4>
<p>CPU usage is a poor signal for model servers. Scale on what users feel or what the GPU is short of: queue depth, in-flight requests, tokens per second against capacity, KV-cache utilization, or p95 latency against target. Keep a minimum number of warm replicas; GPU cold starts take minutes.</p>`,

"""Demo: benchmark p50/p95 and prompt caching with real numbers."""
import statistics
import time

from common.llm import MODEL, OFFLINE, client

POLICY = ("You are the support assistant for Northwind Outfitters. " +
          "Policy section. Returns within 30 days with receipt; outlet items are final sale. " * 300)
QUESTIONS = ["Can I return outlet boots?", "How long is the return window?",
             "Do I need a receipt?", "Can I return worn items?", "Are gift cards refundable?"] * 2


def pct(xs, p):
    xs = sorted(xs)
    return xs[min(len(xs) - 1, int(round(p / 100 * (len(xs) - 1))))]


def run(use_cache):
    lat, ttft, cached, usd = [], [], 0, 0.0
    system = [{"type": "text", "text": POLICY}]
    if use_cache:
        system[0]["cache_control"] = {"type": "ephemeral"}
    for q in QUESTIONS:
        t0 = time.perf_counter()
        if OFFLINE:
            time.sleep(0.05 if use_cache else 0.12)
            lat.append((time.perf_counter() - t0) * 1000)
            ttft.append(lat[-1] * 0.6)
            continue
        first = None
        with client().messages.stream(model=MODEL, max_tokens=200, system=system,
                                      output_config={"effort": "low"},
                                      messages=[{"role": "user", "content": q}]) as s:
            for _ in s.text_stream:
                if first is None:
                    first = time.perf_counter()
            msg = s.get_final_message()
        lat.append((time.perf_counter() - t0) * 1000)
        ttft.append(((first or time.perf_counter()) - t0) * 1000)
        u = msg.usage
        cached += u.cache_read_input_tokens or 0
        # rough cost: cached reads are billed far below normal input; check current pricing
        usd += (u.input_tokens * 4 + (u.cache_read_input_tokens or 0) * 0.2 +
                (u.cache_creation_input_tokens or 0) * 5 + u.output_tokens * 20) / 1e6
    return {"p50_ms": round(statistics.median(lat)), "p95_ms": round(pct(lat, 95)),
            "ttft_p50_ms": round(statistics.median(ttft)), "cached_tokens": cached, "usd": round(usd, 4)}


if __name__ == "__main__":
    print("baseline     ", run(use_cache=False))
    print("prompt cache ", run(use_cache=True))
`},

body: `<p>When you run your own models, these levers trade a little quality for large gains in speed, memory and cost. Measure quality on your eval set after each one.</p>
<h4>Quantization</h4>
<p>Store weights (and sometimes activations) in fewer bits. <b>Post-training quantization (PTQ)</b> converts a trained model using a small calibration set: fast, usually under 1% quality loss at INT8. <b>Quantization-aware training (QAT)</b> simulates low precision during training, recovering quality for aggressive targets. <b>INT8</b> roughly halves memory versus FP16; <b>INT4</b> (GPTQ, AWQ) quarters it, letting a large LLM fit on one GPU, with a larger quality risk on reasoning tasks.</p>
<h4>Mixed precision</h4>
<p>Train and serve in <b>FP16</b> or <b>BF16</b> instead of FP32. BF16 keeps FP32's range, so it rarely overflows; FP16 needs loss scaling during training. Modern GPUs run these formats several times faster.</p>
<h4>Pruning and distillation</h4>
<p><b>Unstructured pruning</b> zeroes individual weights; it only speeds things up with sparse-aware kernels. <b>Structured pruning</b> removes whole heads, channels or layers, which shrinks real compute. <b>Distillation</b> trains a small student model to imitate a large teacher's outputs; it is the most reliable way to get a much faster model for one task, such as a 60M-parameter ranker trained from an LLM's relevance labels.</p>
<h4>Runtimes and kernels</h4>
<p>Export the model to an optimized runtime: <b>ONNX Runtime</b> (portable, CPU and GPU), <b>TensorRT</b> (NVIDIA GPUs, layer fusion, INT8), <b>OpenVINO</b> (Intel CPUs and accelerators). They fuse operations, pick fast kernels and often give a 2–5× speedup with no retraining.</p>
<h4>LLM-specific accelerators</h4>
<ul><li><b>KV cache:</b> stores attention keys and values for past tokens so decode doesn't recompute them. It grows with context length × batch size and is often what limits concurrency; paged KV caches (vLLM) reduce waste.</li>
<li><b>FlashAttention:</b> an attention kernel that avoids writing the full attention matrix to GPU memory; faster and enables longer contexts.</li>
<li><b>Speculative decoding:</b> a small draft model proposes several tokens and the large model verifies them in one pass; same output distribution, often 2–3× faster decode.</li></ul>
<h4>Packaging for serving</h4>
<p>Go from checkpoint to an exported format (ONNX or TensorRT engine), then to a service image with a typed contract: a gRPC <code>.proto</code> or a JSON schema for inputs and outputs, a version in the response, and the artifact hash checked at startup, as in week 1.</p>`,

"""Demo: symmetric per-row quantization to INT8 / INT4 and its effect on outputs."""
import numpy as np

rng = np.random.default_rng(0)
W = rng.normal(0, 0.05, size=(512, 1024)).astype(np.float32)   # one layer's weights
X = rng.normal(0, 1, size=(200, 1024)).astype(np.float32)      # 200 inputs


def quantize(w, bits):
    qmax = 2 ** (bits - 1) - 1
    scale = np.abs(w).max(axis=1, keepdims=True) / qmax        # per-row scale
    q = np.clip(np.round(w / scale), -qmax, qmax).astype(np.int8)
    return q, scale


def dequant(q, scale):
    return q.astype(np.float32) * scale


def topk_agreement(a, b, k=10):
    ta = np.argsort(-a, axis=1)[:, :k]
    tb = np.argsort(-b, axis=1)[:, :k]
    return np.mean([len(set(x) & set(y)) / k for x, y in zip(ta, tb)])


if __name__ == "__main__":
    ref = X @ W.T
    print(f"FP32  size={W.nbytes / 1e6:.2f} MB")
    for bits in (8, 4):
        q, s = quantize(W, bits)
        out = X @ dequant(q, s).T
        rel_err = np.linalg.norm(out - ref) / np.linalg.norm(ref)
        size = W.size * bits / 8 / 1e6 + s.nbytes / 1e6
        print(f"INT{bits}  size={size:.2f} MB  rel_error={rel_err:.4f}  top10_agreement={topk_agreement(out, ref):.3f}")
`},

focus: "choosing a fraud threshold when a missed fraud costs 40 times more than a false alarm",
body: `<h4>Offline vs online evaluation</h4>
<p><b>Offline</b> evaluation scores a model on a held-out dataset before release: fast, repeatable, but only as good as the dataset. <b>Online</b> evaluation measures real outcomes after release: A/B tests, conversion, chargebacks, thumbs-up rate, escalation rate. You need both: offline to stop obvious regressions, online to learn whether it actually helps.</p>
<h4>Classification metrics</h4>
<ul><li><b>Precision:</b> of the items flagged, how many were right. High precision = few false alarms.</li>
<li><b>Recall:</b> of the real positives, how many were caught. High recall = few misses.</li>
<li><b>F1:</b> harmonic mean of the two; useful when you need one number and costs are similar.</li>
<li><b>ROC-AUC:</b> ranking quality across thresholds; can look great on rare positives because true negatives are abundant.</li>
<li><b>PR-AUC:</b> precision vs recall across thresholds; the honest choice when positives are rare (fraud at 0.2%).</li></ul>
<h4>Thresholds from costs, not 0.5</h4>
<p>A score becomes a decision at a threshold. Put a price on each outcome (a missed fraud costs the transaction value, a false alarm costs a support call and an annoyed customer), sweep thresholds, and pick the one with the lowest total expected cost. Re-run the sweep when costs or base rates change.</p>
<h4>Calibration</h4>
<p>A calibrated model's "0.8" means 80% of such cases are positive. Check with a <b>reliability diagram</b> (bucket predictions, plot predicted vs observed rate) and the <b>Brier score</b> (mean squared error of probabilities, lower is better). Fix poor calibration with <b>Platt scaling</b> (a logistic fit on the scores; good for small data) or <b>isotonic regression</b> (a monotonic step function; needs more data). Calibration matters whenever someone acts on the probability itself: pricing, risk limits, or "only auto-approve above 95%".</p>
<p>The same ideas apply to LLM features: a "confidence" field is only useful once you've checked that high confidence really means high accuracy.</p>`,

"""Demo: metrics for rare positives, calibration and Platt scaling (numpy only)."""
import numpy as np

rng = np.random.default_rng(3)
n = 20000
y = (rng.random(n) < 0.02).astype(int)                       # 2% positives
raw = np.where(y == 1, rng.normal(1.2, 1, n), rng.normal(-1.0, 1, n))
p = 1 / (1 + np.exp(-(raw * 2.2 + 1.5)))                     # overconfident scores


def prf(y, p, t):
    pred = p >= t
    tp, fp, fn = np.sum(pred & (y == 1)), np.sum(pred & (y == 0)), np.sum(~pred & (y == 1))
    prec = tp / max(tp + fp, 1)
    rec = tp / max(tp + fn, 1)
    return prec, rec, 2 * prec * rec / max(prec + rec, 1e-9)


def roc_auc(y, p):
    order = np.argsort(p)
    ranks = np.empty(len(p))
    ranks[order] = np.arange(1, len(p) + 1)
    pos = y == 1
    return (ranks[pos].sum() - pos.sum() * (pos.sum() + 1) / 2) / (pos.sum() * (~pos).sum())


def pr_auc(y, p):
    order = np.argsort(-p)
    ys = y[order]
    tp = np.cumsum(ys)
    prec, rec = tp / np.arange(1, len(ys) + 1), tp / ys.sum()
    return np.sum(np.diff(np.concatenate([[0], rec])) * prec)


def reliability(y, p, bins=5):
    edges = np.linspace(0, 1, bins + 1)
    for lo, hi in zip(edges[:-1], edges[1:]):
        m = (p >= lo) & (p < hi)
        if m.sum():
            print(f"  {lo:.1f}-{hi:.1f}: predicted {p[m].mean():.3f} observed {y[m].mean():.3f}  (n={m.sum()})")


def platt(scores, y, steps=3000, lr=0.05):
    a, b = 1.0, 0.0
    s = np.log(scores / (1 - scores))
    for _ in range(steps):
        q = 1 / (1 + np.exp(-(a * s + b)))
        a -= lr * np.mean((q - y) * s)
        b -= lr * np.mean(q - y)
    return lambda x: 1 / (1 + np.exp(-(a * np.log(x / (1 - x)) + b)))


if __name__ == "__main__":
    print("threshold 0.5: precision=%.3f recall=%.3f f1=%.3f" % prf(y, p, 0.5))
    print(f"ROC-AUC={roc_auc(y, p):.3f}   PR-AUC={pr_auc(y, p):.3f}   (PR-AUC is the honest one here)")
    print(f"Brier before={np.mean((p - y) ** 2):.4f}")
    reliability(y, p)
    half = n // 2
    cal = platt(p[:half], y[:half])
    pc = cal(p[half:])
    print(f"Brier after Platt (held-out half)={np.mean((pc - y[half:]) ** 2):.4f}")
    reliability(y[half:], pc)
`},

body: `<p>Live demo of the week: eval dashboards and a gate that blocks bad releases. LLM outputs are open-ended, so evaluation combines code checks, model-graded checks and a small amount of human review.</p>
<h4>What to measure in a RAG assistant</h4>
<ul><li><b>Retrieval:</b> recall@k and context precision (did we fetch the right chunks?).</li>
<li><b>Faithfulness / groundedness:</b> is every claim supported by the retrieved context?</li>
<li><b>Answer relevance and correctness:</b> does it answer the question, and match the reference answer?</li>
<li><b>Format and policy:</b> valid JSON, citations present, no forbidden content. These are plain code checks; always use code when code can decide.</li></ul>
<p>Open-source harnesses such as <b>RAGAS</b> and <b>DeepEval</b> package these metrics; the important part is your golden dataset: real questions, expected answers or key facts, and the source that must be cited.</p>
<h4>LLM-as-judge, calibrated</h4>
<p>A judge model grades outputs against a rubric. Make it reliable: give a specific rubric with a small integer scale, ask for the reason before the score, return structured output, judge one criterion per call, and avoid showing which system produced the answer. Then <b>calibrate</b>: have humans label 50–100 examples, run the judge on the same ones, and measure agreement (accuracy, or Cohen's kappa). Only use the judge as a gate once agreement is high, and re-check it when you change the judge prompt or model.</p>
<h4>Multi-turn continuity</h4>
<p>Many failures only appear in conversation: forgetting a constraint from turn 1, contradicting an earlier answer, or losing the user's name or order id. Script multi-turn test cases with checks on the final turn ("the itinerary must still avoid flights before 9 a.m.").</p>
<h4>Red-team prompts in regression packs</h4>
<p>Every jailbreak, prompt injection, data-leak attempt and embarrassing failure you discover becomes a test case with an expected safe behavior. Keep them in a versioned regression pack and run it on every prompt, model or retrieval change. A fix that isn't in the pack will regress.</p>
<h4>The release gate</h4>
<p>In CI, run the golden set and the red-team pack, compare with the current production baseline, and fail the build if any metric drops beyond a tolerance or any must-pass case fails. Publish a small report so reviewers see what changed.</p>`,

def run():

    red = []

        a = system_under_test(case["q"])
        red.append(case["must_not_include"] not in a.lower())
    return {"faithfulness": sum(faith) / len(faith), "must_include": sum(incl) / len(incl), "red_team": sum(red) / len(red)}


if __name__ == "__main__":

    for k, base in BASELINE.items():
        status = "ok" if scores[k] >= base - TOLERANCE else "FAIL"
        if status == "FAIL":
            failed.append(k)
        print(f"{k:13s} {scores[k]:.2f}  (baseline {base:.2f})  {status}")
    if scores["red_team"] < 1.0:
        failed.append("red_team must be 1.00")
    print("GATE:", "BLOCKED " + str(failed) if failed else "PASSED")

def cohen_kappa(a, b):
    n = len(a)
    po = sum(x == y for x, y in zip(a, b)) / n
    pa, pb = sum(a) / n, sum(b) / n
    pe = pa * pb + (1 - pa) * (1 - pb)
